# Render Blueprint — connect repo and set secrets in the dashboard.
services:
  - type: web
    name: ai-investment-advisor-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AI Investment Advisor
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: APP_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: EMAIL_NOTIFY_ON_RUN
        value: "true"
      - key: FRED_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: MARKET_LOOKBACK_DAYS
        value: "365"
      - key: BASE_CURRENCY
        value: USD
      - key: RISK_PROFILE
        value: aggressive
      - key: ALLOCATION_CONSERVATIVE_PCT
        value: "40"
      - key: ALLOCATION_MODERATE_PCT
        value: "40"
      - key: ALLOCATION_AGGRESSIVE_PCT
        value: "20"
